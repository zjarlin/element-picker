# 发布 @zjarlin/element-picker 到 npm，走 OIDC Trusted Publishing（不使用任何长期 token、不手输 OTP）。
#
# 一次性前置（在你自己的终端、需要 npm 2FA，npm 版本 >= 11.15.0）：
#   npx --yes npm@11.15 trust github @zjarlin/element-picker \
#     --file publish-npm.yml --repo zjarlin/element-picker --allow-publish -y
#   （npm 侧要求建好后 2 天内完成首次成功发布，否则信任关系过期）
#
# 触发：推 v* tag，或手动 workflow_dispatch（可指定 dist-tag）。
name: Publish package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag（latest / next / dev）"
        required: false
        default: "latest"

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # OIDC：npm/pnpm 用这份短期凭证换发布权限，不需要 NPM_TOKEN
      id-token: write
    env:
      NPM_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_tag || 'latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publish (OIDC)
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "skip ${name}@${version}（registry 上已存在）"
            exit 0
          fi
          echo "publish ${name}@${version} -> ${NPM_DIST_TAG}"
          # 必须用 npm 而不是 pnpm：OIDC token exchange 只有 npm 实现，pnpm 会 404。
          npm publish --access public --tag "${NPM_DIST_TAG}" --provenance
